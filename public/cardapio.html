<!DOCTYPE html> 
<html lang="pt-BR">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>
</head> 
<body>
    <h1>Bem-vindo ao Cardápio!</h1>
    <p>Aqui você pode acessar a nossa <strong>comida gostosa</strong> e <em>com muito sabor</em>.</p>
    <input id="searchInput" type="text" placeholder="Pesquisar prato...">
    <select id="selecionarProduto">
        <option value="">Selecione um produto</option>
    </select>
    <input id="digitarQuantidade" type="number" placeholder="Quantidade" min="1">
    <div id="cardapio"></div>
    <div id="detalhesProduto"></div>
    <script src="cardapio.js"></script>
</body>
</html>
